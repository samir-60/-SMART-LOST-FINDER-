# ====================================================================
# FindBack Desktop Application Database Configuration
# ====================================================================

# Set to 'mysql' or 'h2'. If 'auto', application tests MySQL first and falls back to embedded H2 if MySQL is unavailable.
db.type=auto

# MySQL 8 Configuration
db.mysql.url=jdbc:mysql://localhost:3306/findback_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.mysql.username=root
db.mysql.password=root

# Embedded Fallback Database (H2 in MySQL Compatibility Mode)
db.h2.url=jdbc:h2:./data/findback_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.h2.username=sa
db.h2.password=

# Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000

# Application Upload Storage
app.upload.dir=uploads/items/
