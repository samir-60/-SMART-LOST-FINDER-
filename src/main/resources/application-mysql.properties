# ===================================================================
# FindBack - MySQL 8 Production / Development Profile
# Activate via: --spring.profiles.active=mysql
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/findback_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate MySQL 8 Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console in MySQL mode
spring.h2.console.enabled=false

